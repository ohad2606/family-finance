# HTTPS — family-finance.net (primary)
server {
    listen 443 ssl;
    server_name family-finance.net www.family-finance.net;

    ssl_certificate /etc/letsencrypt/live/family-finance.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family-finance.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → non-www
    if ($host = www.family-finance.net) {
        return 301 https://family-finance.net$request_uri;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    root /home/ubuntu/takziv/frontend/dist;
    index index.html;

    # HTML entry point and SW — never cache
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        # .webmanifest is not in nginx's mime.types, so it would otherwise be
        # served as application/octet-stream and rejected as an invalid manifest.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets — cache forever
    location ~* /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /lab/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-lab;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Bank-sync: enforce X-API-Key at the edge + rate limit (map/zone in conf.d/bank-sync-auth.conf).
    location = /api/bank-sync {
        if ($bank_api_key_ok = 0) { return 401; }
        limit_req zone=bank_sync burst=5 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS — myzuzim.net (legacy redirect)
server {
    listen 443 ssl;
    server_name myzuzim.net www.myzuzim.net;

    ssl_certificate /etc/letsencrypt/live/myzuzim.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myzuzim.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://family-finance.net$request_uri;
}

# HTTP → HTTPS redirect (all domains)
server {
    listen 80;
    server_name family-finance.net www.family-finance.net myzuzim.net www.myzuzim.net;
    return 301 https://family-finance.net$request_uri;
}

<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="sm 8 · md 12 · lg 16 · xl 20 · 2xl 22 · pill" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 14px; padding: 18px 16px; align-items: center; }
  .box { width: 84px; height: 84px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-sizing: border-box; }
  .t { font-family: var(--font-display); font-size: 0.66rem; color: var(--muted); }
  .pill { width: 84px; height: 44px; border-radius: var(--radius-pill); background: var(--brass); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.66rem; font-family: var(--font-display); }
</style>
</head>
<body>
  <div class="row">
    <div class="box" style="border-radius: var(--radius-sm);"><span class="t">sm · 8</span></div>
    <div class="box" style="border-radius: var(--radius-md);"><span class="t">md · 12</span></div>
    <div class="box" style="border-radius: var(--radius-lg);"><span class="t">lg · 16</span></div>
    <div class="box" style="border-radius: var(--radius-xl);"><span class="t">xl · 20</span></div>
    <div class="box" style="border-radius: var(--radius-2xl);"><span class="t">2xl · 22</span></div>
    <div class="pill">pill</div>
  </div>
</body>
</html>

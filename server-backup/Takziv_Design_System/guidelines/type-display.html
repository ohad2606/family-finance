<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: #fff; padding: 18px 22px; color: var(--ink); }
  .big { font-weight: var(--fw-black); font-size: 2.4rem; line-height: 1.15; letter-spacing: var(--ls-tight); margin: 0; }
  .mid { font-weight: var(--fw-black); font-size: 1.5rem; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .meta { font-family: var(--font-sans); font-size: 0.72rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
  <p class="big">הכסף שלך, בשליטה שלך</p>
  <p class="mid">שווי נקי ₪127,430 · Heebo 900</p>
  <p class="meta">Heebo — weights 700 / 900 · tabular-nums for currency · letter-spacing −0.5px on large display</p>
</body>
</html>

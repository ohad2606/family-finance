<!-- @dsCard group="Colors" viewport="700x150" name="Money semantics" subtitle="income = forest · expense = terracotta (brighten on dark)" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .wrap { display: flex; gap: 12px; padding: 16px; align-items: stretch; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sw { border-radius: var(--radius-md); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .amt { font-family: var(--font-display); font-weight: var(--fw-black); font-variant-numeric: tabular-nums; }
  .lbl { font-size: 0.78rem; }
  .hex { font-family: var(--font-display); font-size: 0.66rem; opacity: 0.65; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="sw" style="background: var(--card);">
        <span class="lbl" style="color: var(--muted);">הכנסה · income <span class="hex">#2F6B4F</span></span>
        <span class="amt" style="color: var(--income);">+₪14,200</span>
      </div>
      <div class="sw" style="background: var(--card);">
        <span class="lbl" style="color: var(--muted);">הוצאה · expense <span class="hex">#B0573C</span></span>
        <span class="amt" style="color: var(--expense);">−₪3,800</span>
      </div>
    </div>
    <div class="col">
      <div class="sw" style="background: var(--ink);">
        <span class="lbl" style="color: rgba(255,255,255,.6);">on dark <span class="hex">#6EE7B7</span></span>
        <span class="amt" style="color: var(--on-dark-pos);">↑ ₪158,000</span>
      </div>
      <div class="sw" style="background: var(--ink);">
        <span class="lbl" style="color: rgba(255,255,255,.6);">on dark <span class="hex">#FCA5A5</span></span>
        <span class="amt" style="color: var(--on-dark-neg);">↓ ₪30,570</span>
      </div>
    </div>
  </div>
</body>
</html>

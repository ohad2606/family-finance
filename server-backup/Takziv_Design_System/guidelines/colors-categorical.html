<!-- @dsCard group="Colors" viewport="700x110" name="Categorical palette" subtitle="10-step chart palette — donut slices & bars (forest-led)" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; padding: 20px 16px; gap: 0; }
  .sw { flex: 1; height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .sw:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .n { font-family: var(--font-display); font-size: 0.62rem; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--cat-1);"><span class="n">1</span></div>
    <div class="sw" style="background: var(--cat-2);"><span class="n">2</span></div>
    <div class="sw" style="background: var(--cat-3);"><span class="n">3</span></div>
    <div class="sw" style="background: var(--cat-4);"><span class="n">4</span></div>
    <div class="sw" style="background: var(--cat-5);"><span class="n">5</span></div>
    <div class="sw" style="background: var(--cat-6);"><span class="n">6</span></div>
    <div class="sw" style="background: var(--cat-7);"><span class="n">7</span></div>
    <div class="sw" style="background: var(--cat-8);"><span class="n">8</span></div>
    <div class="sw" style="background: var(--cat-9);"><span class="n">9</span></div>
    <div class="sw" style="background: var(--cat-10);"><span class="n">10</span></div>
  </div>
</body>
</html>

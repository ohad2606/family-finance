<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & action" subtitle="paper · card · ink · brass — the core four" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 12px; padding: 16px; }
  .sw { flex: 1; border-radius: var(--radius-lg); padding: 14px; height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid var(--line); }
  .name { font-weight: var(--fw-bold); font-size: 0.82rem; }
  .hex { font-family: var(--font-display); font-size: 0.72rem; opacity: 0.7; letter-spacing: 0.3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--paper); color: var(--ink);">
      <span class="name">Paper</span><span class="hex">#E9EBE4</span>
    </div>
    <div class="sw" style="background: var(--card); color: var(--ink);">
      <span class="name">Card</span><span class="hex">#F7F8F4</span>
    </div>
    <div class="sw" style="background: var(--ink); color: #fff; border-color: var(--ink);">
      <span class="name">Ink</span><span class="hex">#1B2A27</span>
    </div>
    <div class="sw" style="background: var(--brass); color: #fff; border-color: var(--brass);">
      <span class="name">Brass · action</span><span class="hex">#C9A23F</span>
    </div>
  </div>
</body>
</html>

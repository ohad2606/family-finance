<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 — quiet, generous rhythm" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 18px; padding: 22px 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--brass); border-radius: var(--radius-xs); }
  .t { font-family: var(--font-display); font-size: 0.66rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:32px;"></div><span class="t">4</span></div>
    <div class="item"><div class="bar" style="width:8px;height:40px;"></div><span class="t">8</span></div>
    <div class="item"><div class="bar" style="width:12px;height:48px;"></div><span class="t">12</span></div>
    <div class="item"><div class="bar" style="width:16px;height:56px;"></div><span class="t">16</span></div>
    <div class="item"><div class="bar" style="width:24px;height:68px;"></div><span class="t">24</span></div>
    <div class="item"><div class="bar" style="width:32px;height:80px;"></div><span class="t">32</span></div>
  </div>
</body>
</html>

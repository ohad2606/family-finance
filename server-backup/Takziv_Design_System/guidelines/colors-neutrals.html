<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals & lines" subtitle="muted text, hairline borders, white" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; }
  .row { display: flex; gap: 12px; padding: 16px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px; height: 78px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-weight: var(--fw-semibold); font-size: 0.8rem; }
  .hex { font-family: var(--font-display); font-size: 0.7rem; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--muted); color: #fff;">
      <span class="name">Muted text</span><span class="hex">#6B746E</span>
    </div>
    <div class="sw" style="background: var(--line); color: var(--ink);">
      <span class="name">Line · border</span><span class="hex">#D5D8CF</span>
    </div>
    <div class="sw" style="background: #fff; color: var(--ink); border: 1px solid var(--line);">
      <span class="name">White</span><span class="hex">#FFFFFF</span>
    </div>
  </div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x180" name="Iconography" subtitle="no icon font — emoji markers + unicode glyphs" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 16px 20px; color: var(--ink); }
  .grp { margin-bottom: 12px; }
  .h { font-family: var(--font-display); font-size: 0.7rem; color: var(--muted); margin: 0 0 7px; }
  .glyphs { display: flex; gap: 14px; flex-wrap: wrap; font-size: 1.4rem; align-items: center; }
  .uni { display: flex; gap: 16px; font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); }
  .uni span { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .cap { font-family: var(--font-sans); font-size: 0.58rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="grp">
    <p class="h">Emoji — category & status markers</p>
    <div class="glyphs">💰 🛟 🏦 🏠 🚗 🎓 💳 📄 👨‍👩‍👧 ⚠</div>
  </div>
  <div class="grp">
    <p class="h">Unicode — UI affordances</p>
    <div class="uni">
      <span>↑<span class="cap">assets</span></span>
      <span>↓<span class="cap">debts</span></span>
      <span>▲<span class="cap">up</span></span>
      <span>▼<span class="cap">down</span></span>
      <span>›<span class="cap">drill</span></span>
      <span>+<span class="cap">add</span></span>
      <span>←<span class="cap">back</span></span>
      <span>·<span class="cap">sep</span></span>
    </div>
  </div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x190" name="Assistant — UI & body" subtitle="default copy, labels & buttons (400/600/700)" -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 18px 22px; color: var(--ink); }
  .lead { font-size: 1.05rem; line-height: 1.6; color: var(--muted); margin: 0; max-width: 560px; }
  .weights { display: flex; gap: 22px; margin-top: 14px; align-items: baseline; }
  .weights span { font-size: 1.05rem; }
  .eyebrow { font-size: 0.8rem; font-weight: var(--fw-bold); letter-spacing: 1px; text-transform: uppercase; color: var(--brass); margin: 0 0 6px; }
</style>
</head>
<body>
  <p class="eyebrow">ניהול פיננסי משפחתי</p>
  <p class="lead">תקציב עוזר לך ולמשפחתך לעקוב אחרי הכנסות והוצאות, לעמוד בתקציב ולבנות עתיד פיננסי יציב — בפשטות.</p>
  <div class="weights">
    <span style="font-weight:400;">Regular 400</span>
    <span style="font-weight:600;">Semibold 600</span>
    <span style="font-weight:700;">Bold 700</span>
  </div>
</body>
</html>

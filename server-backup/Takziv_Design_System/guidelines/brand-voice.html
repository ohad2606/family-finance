<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 18px 22px; color: var(--ink); }
  .tag { font-family: var(--font-display); font-weight: var(--fw-black); font-size: 1.6rem; letter-spacing: var(--ls-tight); margin: 0; }
  .sub { color: var(--muted); font-size: 0.95rem; line-height: 1.55; margin: 8px 0 0; max-width: 560px; }
  .chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chip { font-size: 0.74rem; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px 10px; }
</style>
</head>
<body>
  <p class="tag">הכסף שלך, בשליטה שלך</p>
  <p class="sub">דברו אל המשפחה, לא אל "המשתמש". בגוף שני, רגוע ומעודד — בלי הטפות ובלי בושה. כל סכום צבוע: ירוק להכנסה, טרקוטה להוצאה.</p>
  <div class="chips">
    <span class="chip">ללא כרטיס אשראי</span>
    <span class="chip">פרטי — לא מוכרים נתונים</span>
    <span class="chip">הוסף תנועה ראשונה</span>
    <span class="chip">עוד 3 ימים</span>
  </div>
</body>
</html>

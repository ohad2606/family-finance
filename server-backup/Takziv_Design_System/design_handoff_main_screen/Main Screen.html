<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תקציב — מסך ראשי</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); background: #DCDFD6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 28px 16px; box-sizing: border-box; min-height: 100%; }
  .caption { font-family: var(--font-display); color: var(--ink); font-size: 0.9rem; opacity: 0.7; }
  .device { width: 400px; height: 800px; max-height: calc(100vh - 90px); border-radius: 44px; background: #fff; padding: 10px; box-shadow: var(--shadow-float), 0 0 0 2px rgba(27,42,39,0.06); box-sizing: border-box; flex-shrink: 0; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--paper); }
  .scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { width: 0; }
  @keyframes tz-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tz-rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div class="caption">תקציב — מסך ראשי (גישה A · חודשי רגוע)</div>
<div class="device"><div class="screen" id="screen"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="redesign-data.jsx"></script>
<script type="text/babel" src="redesign-shared.jsx"></script>
